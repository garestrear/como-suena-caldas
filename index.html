<!doctype html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#174f3a'><link rel='manifest' href='manifest.webmanifest'><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'><title>¿Cómo suena Caldas?</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7f5;color:#173126}header{padding:14px 16px;background:#174f3a;color:#fff}header h1{font-size:21px;margin:0}header p{margin:3px 0 0;font-size:12px;opacity:.9}#map{height:calc(100vh - 72px)}.actions{position:fixed;z-index:1000;right:16px;bottom:22px;display:grid;gap:10px}.btn{border:0;border-radius:999px;padding:13px 16px;font-weight:700;box-shadow:0 4px 18px #0003;background:white;color:#174f3a}.primary{background:#174f3a;color:#fff}.sheet{position:fixed;z-index:2000;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto;box-shadow:0 -6px 30px #0003;display:none}.sheet.open{display:block}.row{display:grid;gap:10px;margin:10px 0}input,textarea,select{width:100%;padding:12px;border:1px solid #ccd6d0;border-radius:10px;font:inherit}textarea{min-height:76px}.status{font-size:13px;background:#eef5f1;padding:9px;border-radius:9px}.close{float:right;border:0;background:none;font-size:25px}.recording{background:#8b1e1e;color:#fff}.preview{max-width:100%;max-height:180px;border-radius:10px}.leaflet-popup-content img{max-width:220px;border-radius:8px}.leaflet-popup-content audio{width:220px}.hint{font-size:12px;color:#5c6f65}
</style></head><body><header><h1>🎙️ ¿Cómo suena Caldas?</h1><p>C.E.R. Claudina Múnera · Mapa sonoro comunitario</p></header><div id='map'></div><div class='actions'><button class='btn' id='locate'>📍 Mi ubicación</button><button class='btn primary' id='new'>＋ Registrar sonido</button></div><section class='sheet' id='sheet'><button class='close' id='close'>×</button><h2>Nuevo registro sonoro</h2><div class='status' id='coords'>Primero obtendremos tu ubicación.</div><div class='row'><input id='titulo' placeholder='Título del registro' maxlength='100'><select id='categoria'><option value='Fauna'>🐦 Fauna</option><option value='Agua'>💧 Agua</option><option value='Clima'>🌧️ Clima</option><option value='Bosque'>🌳 Bosque</option><option value='Rural'>🚜 Rural</option><option value='Urbano'>🏘️ Urbano</option><option value='Comunidad'>👥 Comunidad</option><option value='Otro'>🎧 Otro</option></select><textarea id='descripcion' placeholder='¿Qué estás escuchando?'></textarea><input id='autor' placeholder='Autor o grupo (opcional)' maxlength='80'></div><div class='row'><button class='btn' id='record'>🎙️ Iniciar grabación</button><audio id='audioPreview' controls hidden></audio><label class='btn'>📷 Tomar o elegir foto<input id='photo' type='file' accept='image/*' capture='environment' hidden></label><img id='photoPreview' class='preview' hidden><div class='hint'>Al publicar compartes este registro en el mapa comunitario. Evita datos personales o imágenes sensibles.</div><button class='btn primary' id='publish'>Publicar en el mapa</button><div id='msg' class='status' hidden></div></div></section>
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script>
const SUPABASE_URL='https://razqguojknphecyridjv.supabase.co';
const SUPABASE_KEY='sb_publishable_0BNfxO663DRFd6-Sckyg5A_k53mEtj1';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const map=L.map('map').setView([6.09,-75.64],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let lat=null,lng=null,mediaRecorder=null,chunks=[],audioBlob=null,userMarker=null;
const $=id=>document.getElementById(id), sheet=$('sheet'), msg=$('msg');
function showMsg(t,err=false){msg.hidden=false;msg.textContent=t;msg.style.background=err?'#fdecec':'#eef5f1'}
function locate(openAfter=false){if(!navigator.geolocation)return showMsg('Este navegador no permite ubicación.',true);navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;$('coords').textContent=`📍 Ubicación obtenida (${lat.toFixed(5)}, ${lng.toFixed(5)})`;if(userMarker)map.removeLayer(userMarker);userMarker=L.circleMarker([lat,lng],{radius:8}).addTo(map).bindPopup('Tu ubicación');map.setView([lat,lng],16);if(openAfter)sheet.classList.add('open')},e=>{showMsg('No pudimos obtener la ubicación. Revisa el permiso de ubicación del navegador.',true);if(openAfter)sheet.classList.add('open')},{enableHighAccuracy:true,timeout:12000});}
$('locate').onclick=()=>locate(false);$('new').onclick=()=>{sheet.classList.add('open');locate(false)};$('close').onclick=()=>sheet.classList.remove('open');
$('record').onclick=async()=>{try{if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();return}const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=()=>{audioBlob=new Blob(chunks,{type:mediaRecorder.mimeType||'audio/webm'});$('audioPreview').src=URL.createObjectURL(audioBlob);$('audioPreview').hidden=false;$('record').textContent='🎙️ Grabar de nuevo';$('record').classList.remove('recording');stream.getTracks().forEach(t=>t.stop())};mediaRecorder.start();$('record').textContent='⏹️ Detener grabación';$('record').classList.add('recording')}catch(e){showMsg('No se pudo acceder al micrófono. Revisa el permiso.',true)}};
$('photo').onchange=e=>{const f=e.target.files[0];if(f){$('photoPreview').src=URL.createObjectURL(f);$('photoPreview').hidden=false}};
async function upload(bucket,file,prefix){const ext=(file.name?.split('.').pop()|| (bucket==='audios'?'webm':'jpg')).replace(/[^a-z0-9]/gi,'');const path=`${prefix}-${Date.now()}-${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from(bucket).upload(path,file,{contentType:file.type||undefined});if(error)throw error;return db.storage.from(bucket).getPublicUrl(path).data.publicUrl}
$('publish').onclick=async()=>{try{msg.hidden=true;if(!lat||!lng)throw new Error('Necesitamos tu ubicación antes de publicar.');const titulo=$('titulo').value.trim();if(!titulo)throw new Error('Escribe un título.');if(!audioBlob)throw new Error('Graba un sonido antes de publicar.');$('publish').disabled=true;$('publish').textContent='Subiendo…';const audioFile=new File([audioBlob],'grabacion.webm',{type:audioBlob.type||'audio/webm'});const audio_url=await upload('audios',audioFile,'audio');let foto_url=null;const photo=$('photo').files[0];if(photo)foto_url=await upload('fotos',photo,'foto');const {error}=await db.from('registros_sonoros').insert({titulo,descripcion:$('descripcion').value.trim(),categoria:$('categoria').value,latitud:lat,longitud:lng,audio_url,foto_url,autor:$('autor').value.trim()||null,estado:'publicado'});if(error)throw error;showMsg('✅ Registro publicado. Ya aparece en el mapa.');await loadPoints();setTimeout(()=>sheet.classList.remove('open'),1200)}catch(e){showMsg('Error: '+e.message,true)}finally{$('publish').disabled=false;$('publish').textContent='Publicar en el mapa'}};
const layer=L.layerGroup().addTo(map);async function loadPoints(){const {data,error}=await db.from('registros_sonoros').select('*').eq('estado','publicado').order('created_at',{ascending:false});if(error){console.error(error);return}layer.clearLayers();for(const r of data||[]){let html=`<b>${escapeHtml(r.titulo)}</b><br><small>${escapeHtml(r.categoria||'')}</small>`;if(r.foto_url)html+=`<br><img src="${r.foto_url}" alt="Foto">`;if(r.descripcion)html+=`<p>${escapeHtml(r.descripcion)}</p>`;if(r.audio_url)html+=`<audio controls src="${r.audio_url}"></audio>`;if(r.autor)html+=`<br><small>Registro: ${escapeHtml(r.autor)}</small>`;L.marker([r.latitud,r.longitud]).addTo(layer).bindPopup(html)}}function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}loadPoints();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
